<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Perfil Renan</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to right,#664B00, #BB9A3E, #FFE9AD, #BB9A3E, #664B00);
        }
        img {
            width: 300px;
            border: 3px solid black;
            border-radius: 55%;
            box-shadow: 3px 4px 6px black;
        }
        .links {
            width: 250px;
            height: 40px;
            margin: auto;
            text-align: left;
            
        }
        .links a {
            text-decoration: none;
            color: rgb(72, 87, 7);
        }
        .divpapis {
            width: 350px;
            height: 300px;
            margin: auto;
            text-align: center;
        }
        .img {
            text-align: center;
            width: 300px;
            margin: auto;
        }
        .img > .ata {
            display: none;
        }
        .img:hover > .att {
            display: none;
        }
        .img:hover > .ata {
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="divpapis">
        <h1>Renan</h1>
        <p>Rennz</p>
        <div class="img">
            <img class="att" src="euixi.png" alt="">
            <img class="ata" src="sid.jpg" alt="">
        </div>
        <h2>Rennz, um bom garoto.</h2>
        <h2>Conheça suas redes sociais:</h2>
        <div class="links">
            <a href="https://www.youtube.com/@RenanQWE">Youtube</a> <br><br>
            <a href="https://www.instagram.com/rernnas_possivel/">Instagram</a> <br><br>
            <a href="https://github.com/dashboard">Github</a>
        </div>
    </div>
</body>
</html>
